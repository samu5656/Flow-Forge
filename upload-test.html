<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FlowForge Avatar Upload</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
    label { font-size: 13px; font-weight: 600; color: #94a3b8; margin-top: 12px; display: block; }
    input { width: 100%; margin-top: 6px; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    button { width: 100%; margin-top: 18px; padding: 12px; border-radius: 8px; background: #3b82f6; color: white; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; }
    button:hover { background: #2563eb; }
    #status { margin-top: 15px; font-size: 14px; text-align: center; }
    #preview { display: none; width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 20px auto 0; border: 3px solid #3b82f6; }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="margin-top:0">🖼️ FlowForge Avatar Upload</h2>
    
    <label>JWT Access Token</label>
    <input type="text" id="token" placeholder="Paste your accessToken here..." />

    <label>Select Image</label>
    <input type="file" id="fileInput" accept="image/*" />

    <button onclick="handleUpload()">Upload Profile Picture</button>

    <div id="status"></div>
    <img id="preview" alt="Avatar preview" />
  </div>

  <script>
    async function handleUpload() {
      const token = document.getElementById('token').value.trim();
      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('status');
      const preview = document.getElementById('preview');

      if (!token) {
        status.innerHTML = '<span style="color:#ef4444">⚠️ Please paste your JWT token!</span>';
        return;
      }
      if (!fileInput.files[0]) {
        status.innerHTML = '<span style="color:#ef4444">⚠️ Please choose an image!</span>';
        return;
      }

      // Construct native browser multipart/form-data
      const formData = new FormData();
      formData.append('avatar', fileInput.files[0]);

      status.innerText = '⏳ Uploading to FlowForge API...';

      try {
        const res = await fetch('http://localhost:5000/api/v1/auth/avatar', {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const data = await res.json();

        if (res.ok) {
          status.innerHTML = '<span style="color:#22c55e">✅ Avatar uploaded and saved to DB!</span>';
          preview.src = `http://localhost:5000${data.data.avatarUrl}`;
          preview.style.display = 'block';
        } else {
          status.innerHTML = `<span style="color:#ef4444">❌ Error: ${data.message}</span>`;
        }
      } catch (err) {
        status.innerHTML = `<span style="color:#ef4444">❌ Network Error: ${err.message}</span>`;
      }
    }
  </script>
</body>
</html>
