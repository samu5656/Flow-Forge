nginx

#nginx/nginx.conf

events{
    #Maximum simultaneous connections per worker process
    worker_connections 1024;
}

http{
    include mime.types;
    default_type default_type/octet-stream;

    #performance: Kernal-level file streaming
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    #Define our backend Node.js container as an upstream target
    upstream flowforge_backend{
        server api:5000;
    }

    server{
        #Listen on standard http port 80 (Internet traffic)
        listen 80;
        server_name localhost;

        #Maximum upload size for files(avatars,attachments)
        client_max_body_size 10M;

        #High speed static assests (Offloaded)
        location /uploads/ {
            alias /app/uploads;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        #Websockets (Socket.IO real time)
        
        location /socket.io/ {
            proxy_pass http://flowforge_backend;
            proxy_http_version 1.1;

            #Crucial : Upgrade headers for Websocket handshake
            proxy_set_header Upgrade  $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        #API reverse proxy
        location / {
            process http://flowforge_backend;
            proxy_http_version 1.1

            #forward real client IP address to express
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}